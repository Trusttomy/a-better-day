<title>A Better Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>/* Calm phone app: stone, clay and dusk blue around a silver figure. Light and dark. */
:root{color-scheme:light}
html,body{height:100%}
body{margin:0;background:#F1F0EC;color:#2B3138;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-0.015em;text-wrap:balance}
h1{font-size:1.9rem;font-weight:500;line-height:1.1}
h2{font-size:1.45rem;font-weight:500;line-height:1.15}
h3{font-size:1.05rem;font-weight:600}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;font-weight:500;letter-spacing:.02em;color:#56708A}
.muted{font-size:.92rem;color:#6E7378}
.lbl{font-size:.82rem;font-weight:500;color:#6E7378}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid #A9824A;outline-offset:2px}
.view{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.card{background:#FAF9F6;border:1px solid #E0DDD6;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{background:#FAF9F6;color:#2B3138;border:1px solid #E0DDD6;border-radius:999px;padding:11px 18px;font-weight:500;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:#A9824A;color:#FFFFFF;border-color:#A9824A}
.btn.tile{background:#E6E9EA;color:#56708A;border-color:#E6E9EA}
.btn.big{width:100%;min-height:54px;font-size:1.05rem}
.btn.small{min-height:38px;padding:7px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:grid;grid-template-columns:1fr 1fr}
.seg button{border:1px solid #E0DDD6;background:#FAF9F6;color:#6E7378;padding:10px 8px;font-weight:500;min-height:44px}
.seg button:first-child{border-radius:999px 0 0 999px}
.seg button:last-child{border-radius:0 999px 999px 0;border-left:0}
.seg button[aria-pressed="true"]{background:#2B3138;color:#F1F0EC;border-color:#2B3138}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:500;background:#E6E9EA;color:#56708A}
.pill.ok{background:#6E8C74;color:#FFFFFF}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:1.35rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{background:#FAF9F6;border:1px solid #E0DDD6;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard strong{font-weight:600}
.rcard .muted{font-size:.85rem}
.ex-card{background:#FAF9F6;border:1px solid #E0DDD6;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;position:relative}
.ex-card img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#3A3A3A;display:block}
.ex-card div{padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ex-card strong{font-weight:500;font-size:.95rem;line-height:1.2}
.ex-card[aria-pressed="true"]{outline:2px solid #A9824A;outline-offset:-2px}
.ex-card .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:#A9824A;color:#FFFFFF;display:none;align-items:center;justify-content:center;font-size:.85rem;font-weight:600}
.ex-card[aria-pressed="true"] .tick{display:flex}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid #E0DDD6;background:#FAF9F6;color:#6E7378;border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:500}
.tabs button[aria-pressed="true"]{background:#56708A;color:#FFFFFF;border-color:#56708A}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:#FAF9F6;border:1px solid #E0DDD6;border-radius:12px;padding:8px 10px}
.li img{width:64px;aspect-ratio:16/9;object-fit:contain;background:#3A3A3A;border-radius:6px;flex:none}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.li .grow span{font-size:.82rem;color:#6E7378}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid #E0DDD6;background:#FAF9F6;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem;flex:none}
input,textarea,select{background:#F1F0EC;color:#2B3138;border:1px solid #E0DDD6;border-radius:10px;padding:10px 12px;font:inherit;width:100%;box-sizing:border-box}
textarea{min-height:60px;resize:vertical}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch input{width:22px;height:22px;accent-color:#A9824A}
.warn{background:#E6E9EA;border-radius:12px;padding:12px 14px;font-size:.92rem}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{border:1px solid #E0DDD6;background:#FAF9F6;color:#6E7378;border-radius:14px;padding:8px 2px;font-size:.78rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.chip b{font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:400}
.chip[aria-pressed="true"]{background:#56708A;color:#FFFFFF;border-color:#56708A}
/* Deck */
.deck{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#F1F0EC}
.deck-top{background:#2E353D;color:#FFFFFF;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:12px}
.deck-top .btn{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.35)}
.clock{font-size:.95rem;color:rgba(255,255,255,.85)}
.bar{flex:1;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:0;background:#A9824A;transition:width .25s ease}
.slides{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain}
.stage{flex:none;display:flex;justify-content:center;background:#3A3A3A}
.sheet{flex:none;background:#FAF9F6;border-top:1px solid #E0DDD6;border-radius:18px 18px 0 0;margin-top:-14px;position:relative;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rx{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rx .big{font-size:2.6rem;line-height:1}
.cue{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.cue li::marker{color:#6E7378}
.setrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid #E0DDD6;border-radius:14px;padding:8px 10px}
.setrow .t{font-size:1.2rem}
.setrow input{width:84px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:1.05rem}
.setrow.live{border-color:#A9824A}
.setrow.done .t{color:#6E8C74}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:4px}
.need{font-size:.85rem;color:#6E7378;text-align:center}
.timer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#FFFFFF;background:#2E353D;padding:16px}
.timer .count{font-weight:300;font-size:6.5rem;line-height:1}
.timer .btn{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.4)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,9,20,.6);display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#FAF9F6;border:1px solid #E0DDD6;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90%;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.spot{border:0;width:100%;height:80px;border-radius:12px;display:block}
.spot-wrap{background:#2E353D;padding:6px 12px 8px}
.spot-wrap[hidden]{display:none}
.stickybar{position:sticky;bottom:0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 6px);background:#F1F0EC}
[hidden]{display:none!important}
/* Frame sequence: freeze frames played in a loop with hard cuts */
.fig{position:relative;width:100%;max-width:640px;aspect-ratio:16/9;overflow:hidden;background:#3A3A3A}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;animation:seqf 2.2s linear infinite;animation-play-state:paused}
.fig img:first-child{opacity:1}
.slide.active .fig img,.modal .fig img{animation-play-state:running}
@keyframes seqf{0%{opacity:1}42%{opacity:1}50%{opacity:0}92%{opacity:0}100%{opacity:1}}
@keyframes seqf3{0%{opacity:1}28%{opacity:1}34%{opacity:0}94%{opacity:0}100%{opacity:1}}
@keyframes seqf4{0%{opacity:1}21%{opacity:1}27%{opacity:0}94%{opacity:0}100%{opacity:1}}
@keyframes cut2{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes cut3{0%{opacity:1}34%{opacity:0}100%{opacity:0}}
@keyframes cut4{0%{opacity:1}25%{opacity:0}100%{opacity:0}}
.say{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#FAF9F6;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.say span{position:absolute;left:0;right:0;bottom:0;animation:sayA 4s ease-in-out infinite;animation-play-state:paused}
.say span+span{animation-name:sayB}
.slide.active .say span{animation-play-state:running}
@keyframes sayA{0%,44%{opacity:1}52%,94%{opacity:0}100%{opacity:1}}
@keyframes sayB{0%,46%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fig img{animation-timing-function:step-end!important}.bar i{transition:none}}

<div id="home" class="view"></div>
<div id="lib" class="view" hidden></div>
<div id="build" class="view" hidden></div>
<div id="hist" class="view" hidden></div>
<div id="settings" class="view" hidden></div>
<div id="deck" class="deck" hidden>
  <div class="deck-top">
    <button class="btn small" id="exitBtn" type="button">Exit</button>
    <span class="clock num" id="clock">0:00</span>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <span class="num" id="counter">1 / 1</span>
    <button class="btn small" id="musicBtn" type="button" hidden>Music</button>
  </div>
  <div class="spot-wrap" id="deckSpot" hidden></div>
  <div class="slides" id="slides"></div>
</div>
<div id="timer" class="timer" hidden>
  <div class="eyebrow" id="timerLabel" style="color:#FFFFFF">Rest</div>
  <div class="count num" id="timerCount">30</div>
  <button class="btn" id="timerStop" type="button">Skip rest</button>
</div>

/* Time estimate in seconds for one exercise */
function estimate(c, m){
  const e = EX[c], n = rx(c, m), sides = /each side/.test(e.u) ? 2 : 1;
  if (c[0] === "K") return n * 8 + 10;
  if (c[0] === "P"){ const tp = TEMPO[c] || [5,5]; const h = m === "p" ? tp[1] : tp[0]; return c === "P05" ? 60 : c === "P01" ? 45 : n * h * 2; }
  let work = secs(c, m) ? secs(c, m) * sides : n * 3 * sides;
  if (/each way/.test(e.u)) work = n * 4;
  if (e.u === "min") work = n * 60;
  if (e.u === "sec") work = n;
  return light(c) ? work + 10 : setsFor(c, m) * work + (setsFor(c, m)) * restFor(m) + 15;
}

const Store = {

    Object.assign(this.cache.prefs, g("msr.prefs.v1", {})); this.cache.draft = g("msr.draft.v2", null);
  },
  lset(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  saveSession(s){ this.cache.sessions = [s].concat(this.cache.sessions.filter(x => x.id !== s.id)); this.lset("msr.sessions.v2", this.cache.sessions); },
  deleteSession(id){ this.cache.sessions = this.cache.sessions.filter(x => x.id !== id); this.lset("msr.sessions.v2", this.cache.sessions); },
  saveRoutines(){ this.lset("msr.routines.v1", this.cache.routines); },
  savePrefs(){ this.lset("msr.prefs.v1", this.cache.prefs); },

  dt: null, pending: false,
  saveDraft(s){ this.cache.draft = s; this.pending = true; clearTimeout(this.dt); this.dt = setTimeout(() => this.flush(), 600); },

  if (S.hiit) bindHiit(root); else S.items.forEach((_, i) => bindSetRows(i));
  root.querySelectorAll("textarea[data-note]").forEach(el => el.oninput = () => { S.items[+el.dataset.note].note = el.value; persist(); });
  root.querySelectorAll(".chip").forEach(el => el.onclick = () => { const i = +el.dataset.i; S.items[i].diff = +el.dataset.d; root.querySelectorAll(`.chip[data-i="${i}"]`).forEach(c => c.setAttribute("aria-pressed", c === el)); persist(); });
  root.querySelectorAll("[data-go]").forEach(el => el.onclick = () => go(+el.dataset.go));
  root.querySelectorAll("[data-next]").forEach(el => el.onclick = () => { const i = +el.dataset.next; S.items[i].done = true; persist(); go(i + 1); });
  root.querySelectorAll("[data-skip]").forEach(el => el.onclick = () => { const i = +el.dataset.skip; S.items[i].skipped = true; refreshSets(i); persist(); go(i + 1); });
  root.querySelectorAll("[data-swap]").forEach(el => el.onclick = () => openSwap(+el.dataset.swap));
  renderFinal();
}
function bindHiit(root){
  root.querySelectorAll("[data-reps]").forEach(el => el.oninput = () => { const [a, k] = el.dataset.reps.split("_").map(Number); S.items[a].sets[k].reps = el.value; persist(); });
  root.querySelectorAll("[data-hi]").forEach(b => b.onclick = () => hiitToggle(+b.dataset.hi));
  root.querySelectorAll("[data-hnext]").forEach(b => b.onclick = () => { const i = +b.dataset.hnext;
    if (!S.hiit.timed){ hiitDone(i); go(i + 1); return; }
    if (HI){ if (HI.phase === "work" || HI.was === "work") hiitDone(HI.i); const n = HI.phase === "rest" || HI.was === "rest" ? HI.i : HI.i + 1;
      if (n < S.items.length && !HI.last){ HI = {i: n, phase: "work", end: Date.now() + S.hiit.work * 1000}; go(n); beep(); paintHiit(); } else { HI = null; go(S.items.length); } }
    else go(i + 1); });
}
function go(i){ const n = S.items.length + 1; i = Math.max(0, Math.min(n - 1, i)); $("#slides").scrollTo({left: i * $("#slides").clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
function updateProgress(){ const n = S.items.length + 1; if (S.pos !== idx){ S.pos = idx; persist(); } document.querySelectorAll("#slides .slide").forEach((el, k) => el.classList.toggle("active", k === idx)); $("#counter").textContent = Math.min(idx + 1, n) + " / " + n; $("#barFill").style.width = ((idx + 1) / n * 100) + "%"; }
$("#slides").addEventListener("scroll", () => { const w = $("#slides").clientWidth || 1; const i = Math.round($("#slides").scrollLeft / w); if (i !== idx){ idx = i; slideT0 = Date.now(); updateProgress(); paintHiit(); if (i === S.items.length) renderFinal(); } }, {passive: true});
document.addEventListener("keydown", e => { if ($("#deck").hidden || e.target.matches("input,textarea")) return; if (e.key === "ArrowRight") go(idx + 1); if (e.key === "ArrowLeft") go(idx - 1); });
function renderFinal(){
  const strength = S.items.filter(it => !light(it.code));
  const rows = strength.map(it => { const got = it.sets.filter(x => x.secs > 0);
    return `<tr><td>${esc(EX[it.code].n)}</td><td class="num" style="text-align:right">${it.skipped ? "Skipped" : got.length ? got.map(x => (x.reps || "?") + " in " + fmt(x.secs)).join(", ") : "Not logged"}${it.diff ? ", " + it.diff + "/5" : ""}</td></tr>`; }).join("");
  const timed = S.items.reduce((a, it) => a + it.sets.reduce((b, x) => b + x.secs, 0), 0);
  $("#finalIn").innerHTML = `<span class="eyebrow">Finish</span><h2>${esc(S.name)} done</h2>
    <p class="muted" style="margin:0">Total ${fmt(S.elapsed || 0)}, of which ${fmt(timed)} working. ${S.mode === "p" ? "Punchy" : "Moderate"}.</p>
    <div class="card" style="padding:12px 14px"><table style="width:100%;border-collapse:collapse;font-size:.9rem">${rows || "<tr><td class='muted'>Warm-up and pelvic floor only</td></tr>"}</table></div>
    ${S.trial ? `<button class="btn primary big" type="button" id="endTrial">Done</button>` : `<button class="btn primary big" type="button" id="saveSession">${S.saved ? "Saved" : "Save to history"}</button>`}
    <button class="btn" type="button" data-go="${S.items.length - 1}">Back to last exercise</button><p class="muted" id="saveMsg" style="margin:0"></p>`;
  if ($("#saveSession")){ $("#saveSession").disabled = !!S.saved; $("#saveSession").onclick = async () => { S.saved = true; Store.saveSession(JSON.parse(JSON.stringify(S))); Store.saveDraft(null); Store.flush();
    $("#saveMsg").textContent = "Saved in this browser."; $("#saveSession").disabled = true; $("#saveSession").textContent = "Saved"; }; }
  if ($("#endTrial")) $("#endTrial").onclick = closeDeck;
  $("#finalIn").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
}
$("#exitBtn").onclick = () => { if (live) stopSet(); persist(); Store.flush(); closeDeck(); };
function closeDeck(){ $("#deck").hidden = true; document.body.style.overflow = ""; clearInterval(tick); clearInterval(hiInt); HI = null; try { wake && wake.release(); } catch(e){} wake = null; S = null; live = null; $("#deckSpot").innerHTML = ""; renderHome(); show("home"); }
/* Write the draft straight away when the app is hidden or closed, and keep the screen awake on return */
function saveNow(){ persist(); Store.flush(); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); else if (S){ keepAwake(); hiitStep(); } });
window.addEventListener("pagehide", saveNow);
window.addEventListener("resize", () => { if (S) $("#slides").scrollLeft = idx * $("#slides").clientWidth; });

/* Rest timer */
let tInt = null, actx = null;
function beep(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = .12; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + .35); } catch(e){} try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){} }
function startRest(sec){ let left = sec; $("#timerLabel").textContent = "Rest"; $("#timerCount").textContent = left; $("#timer").hidden = false; clearInterval(tInt);
  tInt = setInterval(() => { left -= 1; $("#timerCount").textContent = left; if (left <= 0){ clearInterval(tInt); beep(); setTimeout(() => $("#timer").hidden = true, 500); } }, 1000); }
$("#timerStop").onclick = () => { clearInterval(tInt); $("#timer").hidden = true; };

/* Swap */
function openSwap(i){
  const cur = S.items[i].code, area = (AREA_OF[cur] || ["core"])[0];
  const pool = Object.keys(EX).filter(c => !light(c) && c !== cur && !S.items.some(it => it.code === c));
  pool.sort((a, b) => ((AREA_OF[b] || []).includes(area) ? 1 : 0) - ((AREA_OF[a] || []).includes(area) ? 1 : 0));
  $("#modalBox").innerHTML = `<div class="row between"><h3>Swap ${esc(EX[cur].n)}</h3><button class="btn small" type="button" id="mClose">Close</button></div>
    <p class="muted" style="margin:0">Same area first. This session only.</p>
    <div class="grid2">${pool.map(c => `<button class="ex-card" type="button" data-pick="${c}"><img src="${thumb(c)}" alt="" loading="lazy"><div><strong>${esc(EX[c].n)}</strong><span class="muted">${esc((AREA_OF[c] || []).map(a => AREA_NAME[a]).join(", "))}</span></div></button>`).join("")}</div>`;
  $("#modal").hidden = false; $("#mClose").onclick = closeModal;
  $("#modalBox").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const c = b.dataset.pick;
    S.items[i] = {code: c, sets: Array.from({length: setsFor(c, S.mode)}, () => ({reps: "", secs: 0})), diff: 0, note: "", done: false, skipped: false};
    const sl = document.querySelector(`#slides .slide[data-i="${i}"]`); sl.outerHTML = slideHTML(S.items[i], i); bindSlides(); updateProgress(); persist(); closeModal(); });
}
function closeModal(){ $("#modal").hidden = true; $("#modalBox").innerHTML = ""; }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

/* Exercise menu (also the builder's picker) */
function renderLib(){
  const inBuild = !!building, list = AREAS.find(a => a[0] === libArea)[2];
  const target = inBuild ? $("#build") : $("#lib");
  const picker = `<div class="tabs" role="group" aria-label="Body area">${AREAS.map(([k, n]) => `<button type="button" data-area="${k}" aria-pressed="${k === libArea}">${esc(n)}</button>`).join("")}</div>
    <div class="grid2">${list.map(c => `<button class="ex-card" type="button" data-ex="${c}" aria-pressed="${inBuild && building.ex.includes(c)}"><span class="tick">&#10003;</span><img src="${thumb(c)}" alt="" loading="lazy"><div><strong>${esc(EX[c].n)}</strong><span class="muted num">${EX[c].m} / ${EX[c].p} ${esc(EX[c].u)}</span></div></button>`).join("")}</div>`;
  if (!inBuild){
    target.innerHTML = `<div class="row between"><h1>Exercise menu</h1><button class="btn" type="button" id="libBack">Home</button></div>
      <p class="muted" style="margin:0">Grouped by the area each move works. Tap one to watch it, try it on its own, or start a routine with it.</p>${picker}`;
    $("#libBack").onclick = () => { renderHome(); show("home"); };
  } else renderBuild(picker);
  target.querySelectorAll("[data-area]").forEach(b => b.onclick = () => { libArea = b.dataset.area; renderLib(); });
  target.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { const c = b.dataset.ex;
    if (inBuild){ const j = building.ex.indexOf(c); if (j >= 0) building.ex.splice(j, 1); else building.ex.push(c); renderLib(); } else viewEx(c); });
}
function viewEx(c){
  const e = EX[c];
  $("#modalBox").innerHTML = `<div class="row between"><span class="eyebrow">${esc((AREA_OF[c] || []).map(a => AREA_NAME[a]).join(", "))}</span><button class="btn small" type="button" id="mClose">Close</button></div>
    <h2>${esc(e.n)}</h2><div style="border-radius:12px;overflow:hidden">${figHTML(c)}</div>
    <div class="row"><span class="pill">Moderate ${e.m} ${esc(e.u)}</span><span class="pill">Punchy ${e.p} ${esc(e.u)}</span></div>
    <ul class="cue">${e.c.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="grid2"><button class="btn primary" type="button" id="tryIt">Try it now</button><button class="btn" type="button" id="buildIt">Build with this</button></div>`;
  $("#modal").hidden = false; $("#mClose").onclick = closeModal;
  $("#tryIt").onclick = () => tryExercise(c);
  $("#buildIt").onclick = () => { closeModal(); startBuild({name: "", ex: light(c) ? [] : [c], warm: true, pelvic: true, kegel: true}); };
}

/* Builder */
function startBuild(r){ building = r ? {id: r.id, name: r.name, ex: r.ex.slice(), warm: r.warm !== false, pelvic: r.pelvic !== false, kegel: r.kegel !== false} : {name: "", ex: [], warm: true, pelvic: true, kegel: true};
  if (building.ex.length) libArea = (AREA_OF[building.ex[0]] || ["legs"])[0]; renderLib(); show("build"); }
function renderBuild(picker){
  const m = Store.cache.prefs.mode || "m", b = building;
  const strength = b.ex.filter(c => !light(c));
  $("#build").innerHTML = `<div class="row between"><h1>${b.id ? "Edit routine" : "Build a routine"}</h1><button class="btn" type="button" id="bBack">Cancel</button></div>
    <section class="card">
      <label style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Name</span><input id="bName" value="${esc(b.name)}" placeholder="For example: Tuesday legs" maxlength="40"></label>
      <div class="row between"><span class="lbl">Estimate</span><span class="num">${b.ex.length ? "about " + planMins(b, m) + " min" : "Add some moves"}</span></div>
      <div class="row">${areasOf(b.ex).map(a => `<span class="pill">${esc(AREA_NAME[a])}</span>`).join("") || `<span class="muted">No areas yet</span>`}</div>
      <label class="switch"><span>Include the warm-up</span><input type="checkbox" id="bWarm" ${b.warm ? "checked" : ""}></label>
      <label class="switch"><span>Finish with pelvic floor</span><input type="checkbox" id="bPf" ${b.pelvic ? "checked" : ""}></label>
      <label class="switch"><span>Finish with Kegel yoga</span><input type="checkbox" id="bKy" ${b.kegel ? "checked" : ""}></label>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px"><h3>In this routine (${b.ex.length})</h3>
      ${b.ex.length ? `<div class="list">${b.ex.map((c, j) => `<div class="li"><img src="${thumb(c)}" alt=""><div class="grow"><strong>${esc(EX[c].n)}</strong><span>${light(c) ? "" : setsFor(c, m) + " x "}${rx(c, m)} ${esc(EX[c].u)}, about ${fmt(estimate(c, m))}</span></div>
        <button class="icon" type="button" data-up="${j}" aria-label="Move up" ${j === 0 ? "disabled" : ""}>&#8593;</button><button class="icon" type="button" data-rm="${j}" aria-label="Remove">&#10005;</button></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Tap moves below to add them.</p>`}
    </section>
    <section style="display:flex;flex-direction:column;gap:10px"><h3>Add moves</h3>${picker}</section>
    <div class="grid2 stickybar">
      <button class="btn" type="button" id="bStart" ${b.ex.length ? "" : "disabled"}>Start now</button>
      <button class="btn primary" type="button" id="bSave" ${b.ex.length ? "" : "disabled"}>Save routine</button></div>`;
  $("#bBack").onclick = () => { building = null; renderHome(); show("home"); };
  $("#bName").oninput = e => { b.name = e.target.value; };
  $("#bWarm").onchange = e => { b.warm = e.target.checked; renderLib(); };
  $("#bPf").onchange = e => { b.pelvic = e.target.checked; renderLib(); };
  $("#bKy").onchange = e => { b.kegel = e.target.checked; renderLib(); };
  $("#build").querySelectorAll("[data-up]").forEach(x => x.onclick = () => { const j = +x.dataset.up; [b.ex[j - 1], b.ex[j]] = [b.ex[j], b.ex[j - 1]]; renderLib(); });
  $("#build").querySelectorAll("[data-rm]").forEach(x => x.onclick = () => { b.ex.splice(+x.dataset.rm, 1); renderLib(); });
  const final = () => ({id: b.id || ("r" + Date.now()), name: b.name.trim() || "My routine " + (Store.cache.routines.length + 1), ex: b.ex.slice(), warm: b.warm, pelvic: b.pelvic, kegel: b.kegel, kind: "mine"});
  $("#bStart").onclick = () => { const r = final(); building = null; show("home"); startSession(r, m); };
  $("#bSave").onclick = () => { const r = final(); Store.cache.routines = Store.cache.routines.filter(x => x.id !== r.id).concat([r]); Store.saveRoutines(); building = null; renderHome(); show("home"); };
}

/* History */
function renderHist(){
  const sessions = Store.cache.sessions;
  $("#hist").innerHTML = `<div class="row between"><h1>History</h1><button class="btn" type="button" id="histBack">Home</button></div>
    ${sessions.length ? `<button class="btn tile" type="button" id="copyLog">Copy log as spreadsheet text</button><span class="muted" id="copyMsg"></span><textarea id="logText" hidden readonly></textarea>` : `<p class="muted" style="margin:0">Nothing saved yet. Every set is kept as you go; finish a session and tap Save to history to add it here.</p>`}
    ${sessions.map(s => { const st = s.items.filter(it => !light(it.code)); const timed = s.items.reduce((a, it) => a + it.sets.reduce((b, x) => b + (x.secs || 0), 0), 0);
      return `<article class="card" style="gap:8px"><div class="row between"><h3>${esc(s.name || s.routine)}</h3><span class="pill">${s.mode === "p" ? "Punchy" : "Moderate"}</span></div>
      <span class="muted">${esc(fmtDate(s.date))}. Total ${fmt(s.elapsed || 0)}, working ${fmt(timed)}.</span>
      <table style="width:100%;border-collapse:collapse;font-size:.88rem">${st.map(it => `<tr><td style="padding:3px 0">${esc(EX[it.code].n)}${it.note ? `<br><span class="muted">${esc(it.note)}</span>` : ""}</td><td class="num" style="text-align:right">${it.skipped ? "Skipped" : it.sets.filter(x => x.secs).map(x => (x.reps || "?") + "/" + fmt(x.secs)).join(" ") || "None"}${it.diff ? ", " + it.diff + "/5" : ""}</td></tr>`).join("")}</table>
      <div class="row" id="del${s.id}"><button class="btn small" type="button" data-del="${s.id}">Delete session</button></div></article>`; }).join("")}`;
  $("#histBack").onclick = () => { renderHome(); show("home"); };
  const cb = $("#copyLog");
  if (cb) cb.onclick = () => { const t = asText(); navigator.clipboard.writeText(t).then(() => $("#copyMsg").textContent = "Copied. Paste into a spreadsheet.").catch(() => { const ta = $("#logText"); ta.hidden = false; ta.value = t; ta.select(); $("#copyMsg").textContent = "Select all and copy the text below."; }); };
  $("#hist").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const id = b.dataset.del, box = $("#del" + id);
    box.innerHTML = `<span class="muted">Delete this session?</span><button class="btn small primary" type="button" data-yes>Delete</button><button class="btn small" type="button" data-no>Keep</button>`;
    box.querySelector("[data-yes]").onclick = () => { Store.deleteSession(id); renderHist(); }; box.querySelector("[data-no]").onclick = renderHist; });
}
function asText(){ const lines = ["date,routine,intensity,exercise,set,reps,seconds,difficulty,notes"];
  Store.cache.sessions.forEach(s => s.items.forEach(it => it.sets.forEach((x, k) => { if (!x.secs) return;
    lines.push([s.date.slice(0, 16).replace("T", " "), s.name, s.mode === "p" ? "punchy" : "moderate", EX[it.code].n, k + 1, x.reps, x.secs, it.diff || "", (it.note || "").replace(/[\n,]/g, " ")].join(",")); })));
  return lines.join("\n"); }

/* Settings and music */
function spotifyEmbed(url){ const m = String(url || "").match(/open\.spotify\.com\/(?:intl[a-z_]*\/)?(playlist|album|artist|track|show)\/([A-Za-z0-9]+)/); return m ? "https://open.spotify.com/embed/" + m[1] + "/" + m[2] + "?utm_source=generator&theme=0" : ""; }
function renderSettings(){
  const P = Store.cache.prefs, e = spotifyEmbed(P.spotify);
  $("#settings").innerHTML = `<div class="row between"><h1>Settings</h1><button class="btn" type="button" id="setBack">Home</button></div>
    <section class="card"><h3>Music</h3><p class="muted" style="margin:0">Paste a Spotify playlist link (Share, Copy link). It plays inside the workout with play, pause and skip.</p>
      <input id="spIn" value="${esc(P.spotify || "")}" placeholder="https://open.spotify.com/playlist/..." inputmode="url">
      <div class="row"><button class="btn primary small" type="button" id="spSave">Save</button>${P.spotify ? `<button class="btn small" type="button" id="spClear">Remove</button>` : ""}<span class="muted" id="spMsg"></span></div>
      ${e ? `<iframe class="spot" style="height:152px" src="${e}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify player"></iframe>` : ""}
    </section>
    <section class="card"><h3>Storage</h3><p class="muted" style="margin:0">Saved in this browser only, on this device.</p></section>`;
  $("#setBack").onclick = () => { renderHome(); show("home"); };
  $("#spSave").onclick = () => { const v = $("#spIn").value.trim(); if (v && !spotifyEmbed(v)){ $("#spMsg").textContent = "That doesn't look like a Spotify link."; return; } P.spotify = v; Store.savePrefs(); renderSettings(); };
  if ($("#spClear")) $("#spClear").onclick = () => { P.spotify = ""; Store.savePrefs(); renderSettings(); };
}
function setupMusic(){ const e = spotifyEmbed(Store.cache.prefs.spotify); const b = $("#musicBtn"), w = $("#deckSpot"); b.hidden = !e; w.hidden = true; w.innerHTML = "";
  b.onclick = () => { if (!w.innerHTML) w.innerHTML = `<iframe class="spot" src="${e}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="Spotify player"></iframe>`; w.hidden = !w.hidden; }; }

/* Start */
Store.init(); renderHome();
{ const t = (location.hash.match(/try=([A-Z]\d\d)/) || [])[1]; if (t && EX[t]) tryExercise(t); }
</script>
